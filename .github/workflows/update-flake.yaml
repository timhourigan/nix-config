---
# Workflow to update the flake regularly
name: update-flake
run-name: Update Flake
on:
  # FIXME - Disable for now
  # schedule:
  #   - cron: "0 3 * * *"     # Every day at 03:00
  workflow_dispatch:          # Allow manual triggering
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update-flake:
    permissions:
      contents: write         # To push changes
      pull-requests: write    # To create PRs if needed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Update flake.lock
        id: update-flake
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3  # v29
        with:
          branch: actions/update-flake
          pr-title: "chore: Update flake.lock"
          pr-labels: |
            actions
            automated
      - name: Run make test
        run: |
          {
            echo 'TEST_RESULT<<EOF'
            make test 2>&1
            echo EOF
          } >> "$GITHUB_ENV"
        timeout-minutes: 5
      - name: Comment PR with test result
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b  # v3.0.1
        with:
          message: |
            ### make test result
            ```
            ${{ env.TEST_RESULT }}
            ```
          pr-number: ${{ steps.update-flake.outputs.pull-request-number }}
