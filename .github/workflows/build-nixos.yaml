---
# Workflow to build NixOS from the flake
name: build-nixos
run-name: Build NixOS
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-os:
    strategy:
      matrix:
        host: [bri7, m625q, mm, opx7070, sid, t490, x13]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      # https://nix.dev/tutorials/nixos/continuous-integration-github-actions
      - name: Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        with:
          name: timhourigan
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        # Using he equivalent of `nixos-rebuild build --flake .` as
        # the nix action does not have `nixos-rebuild``
        run: |
          nix-prefetch-url --name displaylink-620.zip https://www.synaptics.com/sites/default/files/exe_files/2025-09/DisplayLink%20USB%20Graphics%20Software%20for%20Ubuntu6.2-EXE.zip
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
        timeout-minutes: 15
