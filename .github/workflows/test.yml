name: "Flake Check"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Supply-chain hardening: actions pinned to immutable SHAs (floating @vX
      # tags are MUTABLE — a compromised release could rewrite them). Version
      # in the comment; bump by changing the SHA, never the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@8887e596b4ee1134dae06b98d573bd674693f47c
        # v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        # v14
        with:
          name: mycache
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: >-
          nix-channel --add https://github.com/nix-community/home-manager/archive/master.tar.gz  # yamllint disable-line:line-length
          home-manager
      - run: nix-channel --update
      - run: nix flake check
